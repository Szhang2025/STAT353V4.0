<main><section id="m1"></section>
<section id="m2" hidden>
<div class="c"><h2>2.1 Choose data</h2><select id="ds"><option value="phones">Phones</option><option value="exam">Study hours &amp; exam scores</option><option value="comm">Commutes</option></select> or upload a CSV <input id="up" type="file" accept=".csv,text/csv"><p>Variable: <select id="v"></select></p><p class="m" id="di"></p><div id="zdt2" class="tex2jax_ignore"></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const f2=x=>String(+(+x).toPrecision(3)),f4=x=>isFinite(x)?String(+(+x).toFixed(4)):"—";
const TERMS={
experiment:["Experiment","A process with an uncertain outcome. Here: draw one phone at random from the batch of 200."],
sample:["Sample space","The set of all possible outcomes. Here: the 200 phones, each equally likely."],
count:["Multiplication rule","If step 1 has m ways and step 2 has n ways, there are m×n ways in all. 2 brands × 2 origins = 4 cells in our table."],
perm:["Permutation","Ordered selection of k from n: P(n,k)=n!/(n−k)!. Ranking 3 of 200 phones gold/silver/bronze: 200·199·198 = 7,880,400."],
comb:["Combination","Unordered selection: C(n,k)=n!/(k!(n−k)!)=P(n,k)/k!. A set of 5 phones to inspect: C(200,5) = 2,535,650,040."],
event:["Event","Any subset of the sample space. A∪B: A or B (or both); A∩B: both; Aᶜ: not A. I∪V = 150+120−100 = 170 phones."],
venn:["Venn diagram","Circles are events, overlap is the intersection. Count the overlap once: |I∪V| = 150+120−100 = 170."],
prob:["Probability","With equally likely outcomes, P(A) = outcomes in A / outcomes in S. P(I)=150/200=0.75. Axioms: P≥0, P(S)=1, additive for disjoint events."],
cond:["Conditional probability","P(A|B)=P(A∩B)/P(B): shrink the sample space to B. P(I|V)=100/120=0.833: among Vietnam phones, 83% are iPhones."],
indep:["Independence","A, B independent if P(A∩B)=P(A)P(B), i.e. P(A|B)=P(A). Here 0.5 ≠ 0.75×0.6 = 0.45, so brand and origin are dependent."],
disj:["Disjoint events","A∩B=∅, so P(A∩B)=0. Disjoint events with positive probability are never independent: if one happens the other cannot."],
total:["Law of total probability","If B₁…B_k partition S, P(A)=ΣP(A|Bᵢ)P(Bᵢ). Split phones by origin and add the weighted conditional probabilities."],
bayes:["Bayes formula","P(B|A)=P(A|B)P(B)/P(A), with P(A) from total probability. It reverses a conditional: from P(I|V) to P(V|I)."],
tree:["Probability tree","Branches carry conditional probabilities. Multiply along a path for an intersection; add paths that end in the same event."],
rv:["Random variable","A number attached to each outcome. X=1 if the phone is an iPhone, else 0. Discrete: countable values. Continuous: any value in an interval."],
pmf:["pmf","Probability mass function p(k)=P(X=k) for discrete X. Values ≥ 0 and they sum to 1."],
pdf:["pdf","Density f(x) for continuous X. P(a≤X≤b) is the area under f. P(X=x)=0, and f can exceed 1."],
cdf:["CDF","F(x)=P(X≤x). Non-decreasing from 0 to 1: a step function for discrete X, smooth for continuous X."],
mean:["Mean (expected value)","E(X)=Σx·p(x) or ∫x f(x)dx, the long-run average. For the iPhone indicator, E(X)=0.75."],
variance:["Variance","Var(X)=E[(X−μ)²]=E(X²)−μ². Indicator: p(1−p)=0.1875. Var(aX+b)=a²Var(X)."],
sd:["Standard deviation","σ=√Var(X), in the units of X."],
skew:["Skewness","Right skew: long right tail, mean &gt; median. Left skew: long left tail, mean &lt; median."],
cov:["Covariance","Cov(X,Y)=E(XY)−E(X)E(Y). Positive: large together. Var(X+Y)=Var X+Var Y+2Cov(X,Y)."],
cor:["Correlation","ρ=Cov/(σXσY), between −1 and 1, unit-free. Independent ⇒ ρ=0, but ρ=0 does not imply independence."],
joint:["Joint distribution","p(x,y)=P(X=x,Y=y). Marginals: sum the rows or the columns."]};
const T=s=>s.replace(/\[(\w+)\|([^\]]+)\]/g,'<a class="t" data-k="$1">$2</a>');
// ---- charts
const W=340,H=190,L=38,R=8,Tp=8,B=24;
function frame(x0,x1,y0,y1,fn,xt=3,ny=2){const sx=x=>L+(x-x0)/(x1-x0||1)*(W-L-R),sy=y=>H-B-(y-y0)/(y1-y0||1)*(H-B-Tp);
let a=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="currentColor"/><line x1="${L}" y1="${Tp}" x2="${L}" y2="${H-B}" stroke="currentColor"/>`;
for(let i=0;xt&&i<=xt;i++){const v=x0+(x1-x0)*i/xt;a+=`<text x="${sx(v)}" y="${H-8}" text-anchor="middle">${f2(v)}</text>`}
for(let i=0;ny&&i<=ny;i++){const v=y0+(y1-y0)*i/ny;a+=`<text x="${L-4}" y="${sy(v)+3}" text-anchor="end">${f2(v)}</text>`}
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:520px;color:var(--fg)" font-size="10">${a}${fn(sx,sy)}</svg>`}
// ---- Module 1
const venn=`<svg viewBox="0 0 340 170" style="width:100%;max-width:420px;color:var(--fg)" font-size="13"><circle cx="130" cy="85" r="65" class="f" style="opacity:.3"/><circle cx="210" cy="85" r="65" class="b" style="opacity:.3"/><text x="92" y="90" text-anchor="middle">50</text><text x="170" y="90" text-anchor="middle">100</text><text x="248" y="90" text-anchor="middle">20</text><text x="322" y="160" text-anchor="middle">30</text><text x="100" y="18" text-anchor="middle">iPhone I (150)</text><text x="240" y="18" text-anchor="middle">Vietnam V (120)</text></svg>`;
const pI=.75,pV=.6,pIV=.5,pIgV=100/120,pVgI=100/150,pIgNV=50/80;
const RW=[["prob","P(I)","150/200",pI],["prob","P(V)","120/200",pV],["prob","P(I∩V)","100/200",pIV],["event","P(I∪V)","P(I)+P(V)−P(I∩V)",pI+pV-pIV],["cond","P(I | V)","P(I∩V)/P(V)",pIgV],["cond","P(V | I)","P(I∩V)/P(I)",pVgI],["indep","P(I)·P(V)","compare P(I∩V)=0.5",pI*pV],["total","P(I)","P(I|V)P(V)+P(I|Vᶜ)P(Vᶜ)",pIgV*pV+pIgNV*.4],["bayes","P(V | I)","P(I|V)P(V)/P(I)",pIgV*pV/pI]];
const J={11:.5,10:.25,"01":.1,"00":.15},EX_=.75,EY_=.6,cv=.5-EX_*EY_,vX=EX_*(1-EX_),vY=EY_*(1-EY_),vS=2.35-1.35**2;
$("#m1").innerHTML=T(`
<div class="c"><h2>1.1 The batch</h2><p>A batch of 200 smartphones: 120 are made in Vietnam, 100 of those are iPhones, and there are 150 iPhones in total. The [experiment|experiment] is to draw one phone at random; the [sample|sample space] is the 200 phones; an [event|event] is a subset, e.g. I = “iPhone”, V = “made in Vietnam”.</p>
<table><tr><th></th><th>Vietnam</th><th>Elsewhere</th><th>Total</th></tr><tr><th>iPhone</th><td>100</td><td>50</td><td>150</td></tr><tr><th>Other</th><td>20</td><td>30</td><td>50</td></tr><tr><th>Total</th><td>120</td><td>80</td><td>200</td></tr></table>
<p>[venn|Venn diagram] of the counts:</p>${venn}
<p>Simulate: draw <input id="sn" type="number" value="1000" min="1" max="100000"> phones with replacement <button id="sb">Draw</button></p><p id="so" class="m"></p></div>
<div class="c"><h2>1.2 Counting</h2><p>The [count|multiplication rule], [perm|permutations] (order matters) and [comb|combinations] (order does not):</p><p>n <input id="cn" type="number" value="200"> k <input id="ck" type="number" value="5"></p><p id="co"></p></div>
<div class="c"><h2>1.3 Probability rules on the batch</h2><div class="w"><table><tr><th>Quantity</th><th>Formula</th><th>Value</th></tr>${RW.map(([k,a,b,v])=>`<tr><td><a class="t" data-k="${k}">${a}</a></td><td>${b}</td><td>${f4(v)}</td></tr>`).join("")}</table></div>
<p>P(I)P(V)=0.45 ≠ P(I∩V)=0.5, so I and V are not [indep|independent]. I and its complement are [disj|disjoint]; I and V overlap in 100 phones, so they are not. Total probability and [bayes|Bayes] give 0.75 and 0.667 above.</p></div>
<div class="c"><h2>1.4 Probability tree</h2><p>[tree|Tree]: first split by origin, then by brand. Multiply along a path.</p><ul class="tr"><li>Vietnam 0.6<ul class="tr"><li>iPhone 0.833 → 0.6×0.833 = 0.500</li><li>Other 0.167 → 0.100</li></ul></li><li>Elsewhere 0.4<ul class="tr"><li>iPhone 0.625 → 0.250</li><li>Other 0.375 → 0.150</li></ul></li></ul><p class="m">Add the iPhone paths: 0.5+0.25 = 0.75 = P(I).</p></div>
<div class="c"><h2>1.5 Random variables &amp; distributions</h2><p>A [rv|random variable] is discrete (described by a [pmf|pmf]) or continuous (a [pdf|pdf]); both have a [cdf|CDF]. Explore [mean|mean], [variance|variance], [sd|SD] and [skew|skewness]:</p><select id="dn"></select><p class="m" id="dd"></p><div id="dp"></div><div id="dv"></div></div>
<div class="c"><h2>1.6 Joint distribution, covariance, correlation</h2><p>Draw one phone. X=1 if iPhone, Y=1 if made in Vietnam. The [joint|joint pmf] comes straight from the batch:</p>
<table><tr><th></th><th>Y=1</th><th>Y=0</th><th>p(x)</th></tr><tr><th>X=1</th><td>${J[11]}</td><td>${J[10]}</td><td>0.75</td></tr><tr><th>X=0</th><td>${J["01"]}</td><td>${J["00"]}</td><td>0.25</td></tr><tr><th>p(y)</th><td>0.6</td><td>0.4</td><td>1</td></tr></table>
<p>E(X)=0.75, E(Y)=0.6, E(XY)=0.5. [cov|Cov] = 0.5−0.75×0.6 = <b>${f4(cv)}</b>. Var(X)=${f4(vX)}, Var(Y)=${f4(vY)}, so [cor|correlation] = <b>${f4(cv/Math.sqrt(vX*vY))}</b>: weakly positive.</p>
<p>Properties: E(aX+b)=aE(X)+b; Var(aX+b)=a²Var(X); E(X+Y)=E(X)+E(Y)=1.35; Var(X+Y)=Var X+Var Y+2Cov = ${f4(vX)}+${f4(vY)}+${f4(2*cv)} = <b>${f4(vX+vY+2*cv)}</b>. Check directly from the pmf of X+Y: ${f4(vS)}. If they were independent, the covariance term would vanish.</p></div>`);
function cnt(){const n=+$("#cn").value|0,k=+$("#ck").value|0;if(n<0||k<0||k>n||n>400){$("#co").textContent="Need 0 ≤ k ≤ n ≤ 400";return}let p=1n,f=1n;for(let i=0;i<k;i++)p*=BigInt(n-i);for(let i=2;i<=k;i++)f*=BigInt(i);$("#co").innerHTML=`P(${n},${k}) = ${p.toLocaleString()}<br>C(${n},${k}) = ${(p/f).toLocaleString()}<br>k! = ${f.toLocaleString()}`}
$("#cn").oninput=$("#ck").oninput=cnt;cnt();
$("#sb").onclick=()=>{const n=Math.min(1e5,+$("#sn").value||1);let c=0;for(let i=0;i<n;i++)if(Math.random()<.75)c++;$("#so").textContent=`${c} iPhones in ${n} draws: relative frequency ${f4(c/n)} (true P(I)=0.75). More draws get closer: the law of large numbers.`};
const lf=n=>{let s=0;for(let i=2;i<=n;i++)s+=Math.log(i);return s};
const DS={
Bernoulli:{t:"One trial: success with probability p (e.g. a phone is an iPhone).",d:1,P:[["p",.05,.95,.05,.3]],r:()=>[0,1],f:(k,p)=>k?p:1-p},
Binomial:{t:"Number of successes in n independent trials.",d:1,P:[["n",1,40,1,12],["p",.05,.95,.05,.3]],r:n=>[0,n],f:(k,n,p)=>Math.exp(lf(n)-lf(k)-lf(n-k)+k*Math.log(p)+(n-k)*Math.log(1-p))},
Geometric:{t:"Number of trials until the first success.",d:1,P:[["p",.1,.9,.05,.25]],r:()=>[1,40],f:(k,p)=>(1-p)**(k-1)*p},
Poisson:{t:"Count of events in a fixed interval, rate λ.",d:1,P:[["λ",.5,15,.5,4]],r:l=>[0,Math.ceil(l+6*Math.sqrt(l)+5)],f:(k,l)=>Math.exp(-l+k*Math.log(l)-lf(k))},
Uniform:{t:"All values between a and b equally likely.",d:0,P:[["a",0,5,.5,0],["b",6,12,.5,8]],r:(a,b)=>[a-1,b+1],f:(x,a,b)=>x>=a&&x<=b?1/(b-a):0},
Exponential:{t:"Waiting time with rate λ; memoryless.",d:0,P:[["λ",.2,3,.1,1]],r:l=>[0,7/l],f:(x,l)=>l*Math.exp(-l*x)},
Normal:{t:"Bell curve with mean μ and standard deviation σ.",d:0,P:[["μ",-5,5,.5,0],["σ",.5,4,.1,1]],r:(m,s)=>[m-4*s,m+4*s],f:(x,m,s)=>Math.exp(-(((x-m)/s)**2)/2)/(s*Math.sqrt(2*Math.PI))}};
$("#dn").innerHTML=Object.keys(DS).map(k=>`<option>${k}</option>`).join("");
function setP(){const d=DS[$("#dn").value];$("#dd").textContent=d.t;$("#dp").innerHTML=d.P.map(([n,a,b,s,v])=>`<label>${n} = <b>${v}</b> <input type="range" min="${a}" max="${b}" step="${s}" value="${v}"></label> `).join("");$$("#dp input").forEach(i=>i.oninput=rd);rd()}
function rd(){const d=DS[$("#dn").value],p=$$("#dp input").map(i=>+i.value);$$("#dp b").forEach((b,i)=>b.textContent=p[i]);
const [lo,hi]=d.r(...p);let xs=[],ys=[],w=[];
if(d.d)for(let k=lo;k<=hi;k++){xs.push(k);ys.push(d.f(k,...p));w=ys}else{const dx=(hi-lo)/400;for(let i=0;i<=400;i++){const x=lo+i*dx;xs.push(x);ys.push(d.f(x,...p));w.push(ys[i]*dx)}}
const tot=w.reduce((a,b)=>a+b),m=xs.reduce((a,x,i)=>a+x*w[i],0)/tot,v=xs.reduce((a,x,i)=>a+(x-m)**2*w[i],0)/tot,sd=Math.sqrt(v),sk=xs.reduce((a,x,i)=>a+((x-m)/sd)**3*w[i],0)/tot;
let c=0;const F=w.map(x=>c+=x/tot),ym=Math.max(...ys)*1.1;
const pm=d.d?frame(lo-.5,hi+.5,0,ym,(sx,sy)=>xs.map((x,i)=>`<rect class="f" x="${sx(x-.35)}" y="${sy(ys[i])}" width="${sx(x+.35)-sx(x-.35)}" height="${sy(0)-sy(ys[i])}"/>`).join("")):frame(lo,hi,0,ym,(sx,sy)=>`<polyline class="l" points="${xs.map((x,i)=>sx(x)+","+sy(ys[i])).join(" ")}"/>`);
const pts=d.d?xs.flatMap((x,i)=>[[x,i?F[i-1]:0],[x,F[i]]]):xs.map((x,i)=>[x,F[i]]);
const cd=frame(d.d?lo-.5:lo,d.d?hi+.5:hi,0,1,(sx,sy)=>`<polyline class="l" points="${pts.map(q=>sx(q[0])+","+sy(q[1])).join(" ")}"/>`);
$("#dv").innerHTML=`<p>Mean <b>${f2(m)}</b> · Var <b>${f2(v)}</b> · SD <b>${f2(sd)}</b> · skewness ${f2(sk)} → <b>${Math.abs(sk)<.2?"roughly symmetric":sk>0?"right-skewed":"left-skewed"}</b></p><p class="m">${d.d?"pmf P(X=k)":"pdf f(x) (area = probability)"}</p>${pm}<p class="m">CDF F(x)=P(X≤x)</p>${cd}`}
$("#dn").onchange=setP;setP();
// ---- Module 2
const CSV={phones:"brand,vietnam,price,storage,battery\niPhone,Y,799,128,20\niPhone,Y,899,256,22\niPhone,N,1099,512,24\niPhone,Y,1199,512,26\niPhone,N,699,128,18\niPhone,Y,999,256,23\nSamsung,Y,649,128,19\nSamsung,Y,799,256,21\nSamsung,N,999,512,24\nSamsung,Y,349,64,16\nPixel,N,599,128,20\nPixel,N,799,256,22\nPixel,Y,449,128,18\nXiaomi,Y,299,64,17\nXiaomi,Y,399,128,19\nXiaomi,N,249,64,15\nOnePlus,N,549,256,21\nMoto,Y,199,64,15",
exam:"hours,score\n1,52\n2,55\n2,61\n3,58\n3,66\n4,64\n4,72\n5,70\n5,75\n6,79\n6,74\n7,83\n8,86\n9,90\n10,93",
comm:"km,minutes\n2,6\n3,7\n3,9\n4,8\n5,12\n5,11\n6,14\n7,15\n8,17\n9,19\n10,18\n12,25\n15,28\n18,31\n25,40\n30,55"};
const DB={};let cols,st,SC;
function parse(t){const Ls=t.trim().split(/\r?\n/).map(r=>r.split(",").map(s=>s.trim())),h=Ls.shift(),o={};h.forEach((n,i)=>{const raw=Ls.map(r=>r[i]??""),v=raw.filter(s=>s!==""),num=v.length>0&&v.every(s=>isFinite(s));o[n]={num,raw}});return o}

Object.assign(TERMS,{
srs:["Simple random sample (SRS)","Every possible sample of size n is equally likely, so each unit has the same chance of selection. The standard error formulas assume it; a convenience sample can be biased however large it is."],
unbiased:["Unbiased estimator","Its average over all possible samples equals the parameter: E(x̄)=μ, E(p̂)=p, E(s²)=σ². Unbiased does not mean any single estimate is right, only that there is no systematic error."],
se:["Standard error","The standard deviation of an estimator across repeated samples. For x̄ it is σ/√n, estimated by s/√n because σ is unknown. For p̂ it is √(p(1−p)/n). Quadrupling n halves it."],
clt:["Central Limit Theorem","For large n, x̄ is approximately normal with mean μ and SD σ/√n whatever the population shape. Skewed populations need a larger n."],
tdist:["t distribution","With σ unknown, (x̄−μ)/(s/√n) follows a t distribution with n−1 df, not a normal, because s changes from sample to sample. Tails are heavier; as df grows it approaches the standard normal."],
alpha:["Significance level α","The Type I error rate you accept: P(reject H0 when H0 is true). Choose it before seeing the data from the cost of a false alarm: smaller (0.01) when a false positive is costly, larger (0.10) when missing a real effect is costly. 0.05 is a convention, not a law."],
typeI:["Type I error","Rejecting a true H0 (false alarm). Its probability is α."],
typeII:["Type II error","Failing to reject a false H0 (missed effect). Its probability is β, and power = 1−β. β shrinks with larger n, larger true effect, larger α and smaller σ."],
ci:["Confidence interval","Estimate ± critical value × SE. A 95% interval comes from a procedure that captures the true parameter in 95% of repeated samples. Once computed, this interval either contains the parameter or not; 95% describes the method, not this interval."],
pval:["p-value","Assuming H0 is true, the probability of a test statistic at least as extreme as the one observed. It is not the probability that H0 is true, and not the probability the result is due to chance. A small p means the data would be surprising under H0."],
citest:["CI and two-sided test","A two-sided level-α test of H0: θ=θ0 rejects exactly when the (1−α) confidence interval excludes θ0. So the CI lists every null value that would not be rejected, and also shows the size of the effect."],
gof:["Chi-square goodness of fit","One categorical variable. Compares observed counts with those expected under a stated distribution: χ²=Σ(O−E)²/E, df = categories − 1. Needs expected counts of about 5 or more."],
chiind:["Chi-square test of independence","One sample, two categorical variables. H0: they are independent, so E = row total × column total / n, df = (r−1)(c−1)."],
homog:["Chi-square test of homogeneity","Separate samples from several populations, one categorical response. H0: the response distribution is the same in every population. Same arithmetic as independence; the sampling design differs."],
slope:["Slope","In y = b0 + b1x, b1 is the predicted change in y for a one-unit increase in x. With several predictors: for a one-unit increase in that x, holding the others fixed. It describes association, not causation."],
r2:["R²","Share of the variation in y explained by the model, 1 − SSE/SST. It never falls when predictors are added; adjusted R² penalises useless ones."],
multicol:["Multicollinearity","Predictors strongly correlated with each other. Slopes become unstable with large SEs and may even change sign, although predictions can stay fine. VIF_j = 1/(1−R²_j) from regressing x_j on the other predictors; above 5–10 is a warning."],
anova:["One-way ANOVA","Compares k group means. F = MSB/MSW with k−1 and N−k df. H0: all means equal. A small p says at least one mean differs, not which."],
multtest:["Multiple testing","With m tests at level α the chance of at least one false positive is 1−(1−α)^m. Bonferroni uses α/m per test (or multiplies each p by m), holding the familywise error at α at the cost of power."]});

bayes:["Bayes formula",R_`$P(B\mid A)=\frac{P(A\mid B)P(B)}{P(A)}$, with $P(A)$ from total probability. It reverses a conditional: from $P(I\mid V)$ to $P(V\mid I)$.`],
pmf:["pmf",R_`Probability mass function $p(k)=P(X=k)$ for discrete $X$. Values are $\ge0$ and $\sum_k p(k)=1$.`],
pdf:["pdf",R_`Density $f(x)$ for continuous $X$: $P(a\le X\le b)=\int_a^b f(x)\,dx$. $P(X=x)=0$, and $f$ can exceed 1.`],
cdf:["CDF",R_`$F(x)=P(X\le x)$. Non-decreasing from 0 to 1: a step function for discrete $X$, smooth for continuous $X$.`],
mean:["Mean (expected value)",R_`$E(X)=\sum_x x\,p(x)$ or $\int x f(x)\,dx$, the long-run average. For the iPhone indicator, $E(X)=0.75$.`],
variance:["Variance",R_`$\mathrm{Var}(X)=E[(X-\mu)^2]=E(X^2)-\mu^2$. Indicator: $p(1-p)=0.1875$. $\mathrm{Var}(aX+b)=a^2\,\mathrm{Var}(X)$.`],
sd:["Standard deviation",R_`$\sigma=\sqrt{\mathrm{Var}(X)}$, in the units of $X$.`],
cov:["Covariance",R_`$\mathrm{Cov}(X,Y)=E(XY)-E(X)E(Y)$. Positive: large together. $\mathrm{Var}(X+Y)=\mathrm{Var}X+\mathrm{Var}Y+2\,\mathrm{Cov}(X,Y)$.`],
cor:["Correlation",R_`$\rho=\frac{\mathrm{Cov}(X,Y)}{\sigma_X\sigma_Y}$, between $-1$ and $1$, unit-free. Independent $\Rightarrow\rho=0$, but $\rho=0$ does not imply independence.`],
joint:["Joint distribution",R_`$p(x,y)=P(X=x,Y=y)$. Marginals: sum the rows or the columns.`],
unbiased:["Unbiased estimator",R_`Its average over all possible samples equals the parameter: $E(\bar x)=\mu$, $E(\hat p)=p$, $E(s^2)=\sigma^2$. Unbiased does not mean any single estimate is right, only that there is no systematic error.`],
se:["Standard error",R_`The standard deviation of an estimator across repeated samples. For $\bar x$ it is $\sigma/\sqrt n$, estimated by $s/\sqrt n$ because $\sigma$ is unknown. For $\hat p$ it is $\sqrt{p(1-p)/n}$. Quadrupling $n$ halves it.`],
clt:["Central Limit Theorem",R_`For large $n$, $\bar x$ is approximately normal with mean $\mu$ and SD $\sigma/\sqrt n$ whatever the population shape. Skewed populations need a larger $n$.`],
tdist:["t distribution",R_`With $\sigma$ unknown, $\frac{\bar x-\mu}{s/\sqrt n}$ follows a $t$ distribution with $n-1$ df, not a normal, because $s$ changes from sample to sample. Tails are heavier; as df grows it approaches the standard normal.`],
alpha:["Significance level α",R_`The Type I error rate you accept: $\alpha=P(\text{reject }H_0\mid H_0\text{ true})$. Choose it before seeing the data from the cost of a false alarm: smaller (0.01) when a false positive is costly, larger (0.10) when missing a real effect is costly. 0.05 is a convention, not a law.`],
typeII:["Type II error",R_`Failing to reject a false $H_0$ (missed effect). Its probability is $\beta$, and power $=1-\beta$. $\beta$ shrinks with larger $n$, larger true effect, larger $\alpha$ and smaller $\sigma$.`],
ci:["Confidence interval",R_`Estimate $\pm$ critical value $\times$ SE, e.g. $\bar x\pm t^*\frac{s}{\sqrt n}$. A 95% interval comes from a procedure that captures the true parameter in 95% of repeated samples. Once computed, this interval either contains the parameter or not; 95% describes the method, not this interval.`],
citest:["CI and two-sided test",R_`A two-sided level-$\alpha$ test of $H_0:\theta=\theta_0$ rejects exactly when the $(1-\alpha)$ confidence interval excludes $\theta_0$. So the CI lists every null value that would not be rejected, and also shows the size of the effect.`],
gof:["Chi-square goodness of fit",R_`One categorical variable. Compares observed counts with those expected under a stated distribution: $\chi^2=\sum\frac{(O-E)^2}{E}$, df = categories $-1$. Needs expected counts of about 5 or more.`],
chiind:["Chi-square test of independence",R_`One sample, two categorical variables. $H_0$: independent, so $E=\frac{\text{row total}\times\text{column total}}{n}$ and df $=(r-1)(c-1)$.`],
slope:["Slope",R_`In $y=b_0+b_1x$, $b_1$ is the predicted change in $y$ for a one-unit increase in $x$. With several predictors: for a one-unit increase in that $x$, holding the others fixed. It describes association, not causation.`],
r2:["R²",R_`Share of the variation in $y$ explained by the model: $R^2=1-\frac{SSE}{SST}$. It never falls when predictors are added; adjusted $R^2$ penalises useless ones.`],
multicol:["Multicollinearity",R_`Predictors strongly correlated with each other. Slopes become unstable with large SEs and may even change sign, although predictions can stay fine. $\mathrm{VIF}_j=\frac{1}{1-R_j^2}$, where $R_j^2$ comes from regressing $x_j$ on the other predictors; above 5 to 10 is a warning.`],
anova:["One-way ANOVA",R_`Compares $k$ group means. $F=\frac{MSB}{MSW}$ with $k-1$ and $N-k$ df. $H_0:\mu_1=\dots=\mu_k$. A small p says at least one mean differs, not which.`],
multtest:["Multiple testing",R_`With $m$ tests at level $\alpha$ the chance of at least one false positive is $1-(1-\alpha)^m$. Bonferroni tests each at $\alpha/m$ (or multiplies each p by $m$), holding the familywise error at $\alpha$ at the cost of power.`]});
EX.m=s=>R_`Add all values: $\sum x_i=${f2(s.m*s.n)}$. Divide by $n=${s.n}$: $\bar x=\frac{${f2(s.m*s.n)}}{${s.n}}=${f2(s.m)}$. The mean is the balance point of the data.`;
EX.v=s=>R_`Mean $\bar x=${f2(s.m)}$. First squared deviations: ${s.x.slice(0,3).map(v=>`(${f2(v)}−${f2(s.m)})² = ${f2((v-s.m)**2)}`).join("; ")}… Sum over all ${s.n} values: $${f2(s.ss)}$. Divide by $n-1=${s.n-1}$: $s^2=\frac{\sum(x_i-\bar x)^2}{n-1}=${f2(s.v)}$ (squared units).`;
EX.sd=s=>R_`$s=\sqrt{${f2(s.v)}}=${f2(s.sd)}$, in the data’s own units: a typical distance from the mean.`;
EX.sk=s=>R_`Average of $\left(\frac{x-\bar x}{s}\right)^3=${f2(s.sk)}$. Positive → right skew (mean ${f2(s.m)} vs median ${f2(s.med)}); negative → left skew; near 0 → roughly symmetric.`;
EX.r=()=>R_`$r=\frac{\sum(x-\bar x)(y-\bar y)}{\sqrt{\sum(x-\bar x)^2\,\sum(y-\bar y)^2}}=\frac{${f2(SC.sxy)}}{\sqrt{${f2(SC.sxx)}\cdot${f2(SC.syy)}}}=${f4(SC.r)}$. The sign gives direction, the size gives linear strength. It does not prove causation.`;

zc0.innerHTML=T(R_`<h2>1.6 Z-scores and the standard normal distribution</h2><p>A [zscore|z-score] $z=\frac{x-\mu}{\sigma}$ measures how many standard deviations a value lies from the mean. Standardising any normal variable gives the [stdnorm|standard normal] $Z\sim N(0,1)$, so one function, $\Phi(z)=P(Z\le z)$, answers every normal question. We need this later: confidence intervals use critical values $z^*$, and tests compare a standardised statistic with the standard normal (or $t$).</p><p>μ <input id="zzm" type="number" value="70"> σ <input id="zzs" type="number" value="5" min="0.1" step="any"> x <input id="zzx" type="number" value="78"></p><div id="zzo"></div><p>Empirical rule: $P(|Z|\lt1)=${f4(pn(1)-pn(-1))}$, $P(|Z|\lt2)=${f4(pn(2)-pn(-2))}$, $P(|Z|\lt3)=${f4(pn(3)-pn(-3))}$. Critical values: $z^*=${f4(zcrit(.9))}$ (90%), $${f4(zcrit(.95))}$ (95%), $${f4(zcrit(.99))}$ (99%).</p>`);

c25.innerHTML=T(R_`<h2>2.5 Concepts behind the tools</h2><ul><li><b>Variable types.</b> Categorical: nominal (brand) or ordinal (Low, Medium, High). Numeric: discrete (counts) or continuous (measurements). Codes such as zip codes are labels, not numbers to average. Bar plots are for categories, histograms for numbers.</li><li><b>Shift and scale.</b> Adding $c$ to every value shifts the mean and median by $c$ and leaves the SD and IQR unchanged; multiplying by $c$ multiplies the mean and SD by $|c|$ (the variance by $c^2$). Correlation does not depend on units.</li><li><b>Position.</b> $Q_1$ is about the 25th percentile. A [zscore|z-score] $z=\frac{x-\bar x}{s}$ counts SDs from the mean; for bell-shaped data about 68%, 95%, 99.7% lie within 1, 2, 3 SDs (section 1.6).</li><li><b>Robustness.</b> The mean, SD and $r$ are pulled by outliers; the median and IQR resist. A log transform pulls in a long right tail.</li><li><b>Why divide by $n-1$.</b> Deviations from $\bar x$ (estimated from the same data) are slightly too small, so dividing by $n-1$ makes $s^2$ unbiased for $\sigma^2$.</li><li><b>Pitfalls.</b> Selection bias (a bigger sample does not fix it); bar plots with a truncated axis exaggerate differences; a lurking variable can reverse a trend when groups are pooled (Simpson’s paradox); correlation is not causation; identical summaries can hide very different shapes (Anscombe’s quartet), so always plot.</li></ul><p>Outlier demo: data <input type="text" id="zod" value="3,4,5,6,7"> <button id="zob">Add outlier 102</button></p><div id="zoo"></div>`);

const c36=document.createElement("div");c36.className="c";
c36.innerHTML=T(R_`<h2>3.6 Key ideas behind the tools</h2><ul><li><b>Paired data.</b> When the same units are measured twice (before and after), analyse the within-unit differences with a one-sample $t$ procedure: choose “Paired means” in 3.3.</li><li><b>CI width.</b> Width is proportional to $\frac{1}{\sqrt n}$ and grows with the confidence level (larger critical value). Halving the width takes four times the data.</li><li><b>Statistical vs practical significance.</b> With a huge sample a trivial effect can give a tiny [pval|p-value]; with a small sample a large effect can give a large one. Read the CI and the effect size, and remember that a large $p$ is not proof of no effect (power may be low).</li><li><b>Association vs causation.</b> A rejected chi-square test shows association, not causation. Strength needs an effect size such as Cramér’s $V=\sqrt{\frac{\chi^2}{n\,\min(r-1,\,c-1)}}$, and causal claims need a randomised experiment.</li><li><b>Bias is not cured by $n$.</b> A larger sample shrinks the [se|standard error] but not the bias of a non-random sample ([srs|SRS]).</li></ul>`);

// Module 4: key-ideas card
const c43=document.createElement("div");c43.className="c";
c43.innerHTML=T(R_`<h2>4.3 Key ideas and cautions</h2><ul><li><b>Least squares.</b> The fitted line minimises $\sum e_i^2$, where the residual is $e_i=y_i-\hat y_i$ (observed minus fitted). In simple regression $R^2=r^2$.</li><li><b>Intercept and extrapolation.</b> The intercept is the predicted $y$ at $x=0$, meaningful only if $x=0$ is plausible. Predicting far outside the range of the data (extrapolation) is risky.</li><li><b>Residual plots.</b> A random band around zero is good; a curve means a missing nonlinear term; a funnel means the variance changes with the fitted value.</li><li><b>Leverage and influence.</b> Points with extreme $x$ (or a large residual) can pull the line toward themselves; refit without them to check.</li><li><b>Spurious correlation.</b> Two trending series often give a high $R^2$ with no causal link.</li><li><b>Slope tests are conditional.</b> The p-value of a slope asks whether $x$ adds to the model given the other predictors; the overall $F$ test asks whether at least one slope is nonzero.</li><li><b>ANOVA assumptions.</b> Independent observations, roughly normal residuals, similar group spreads. $F$ is an omnibus test: it says some mean differs, not which. $\eta^2=\frac{SSB}{SST}$ is the effect size.</li><li><b>Many outcomes.</b> Testing 20 outcomes and reporting the smallest p inflates false positives; report all tests and adjust (see multiple testing).</li></ul>`);
